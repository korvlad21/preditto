x-backend-environment: &backend-environment
  APP_PORT: 8080
  APP_ENV: ${APP_ENV:-}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
  JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
  JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-720h}
  JWT_REFRESH_TOKEN_SHORT_TTL: ${JWT_REFRESH_TOKEN_SHORT_TTL:-12h}

x-mail-environment: &mail-environment
  MAIL_ENABLED: ${MAIL_ENABLED:-false}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Preditto}
  SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
  SMTP_AUTH_TYPE: ${SMTP_AUTH_TYPE:-plain}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}

services:
  backend:
    build: &backend-build
      context: ./backend
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      <<: [*backend-environment, *mail-environment]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${APP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      seed:
        condition: service_completed_successfully

  mailtest:
    profiles: ["tools"]
    build: *backend-build
    working_dir: /app
    volumes:
      - ./backend:/app
    environment: *mail-environment
    entrypoint: ["go", "run", "./cmd/mailtest"]

  seed:
    build: *backend-build
    restart: "no"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment: *backend-environment
    command: ["go", "run", "./cmd/seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations:ro
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: ${POSTGRES_SSLMODE}
    # The PostgreSQL driver reads connection settings from PG* environment variables.
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres:///"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
